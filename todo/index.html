  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css"/>
  <title>Todo List</title>
</head>
<body>
  <div class="container">
    <h1 class="text-center">Todos</h1>
    <h3 class="headers">Create <span class="spanElement">Task</span></h3>    
    <input type="text" id="taskInput" placeholder="what needs to be done?" class="task-input"/>
    <button class="button-add" id="addTodoButton">Add</button>
    <br><br>
    <h3 class="headers">My <span class="spanElement">Tasks</span></h3>    
    <ul class="todo-items-continer" id="todoItemsContainer">
      
    </ul>
    <button class="button-add" style="width: 80px;" id="saveButton">Save</button>
  </div>
</body>
<script type="text/javascript" src="script.js"></script>
</html>
