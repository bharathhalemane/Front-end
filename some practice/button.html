<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: #02072e;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 40vh;
        }

        button{
            position: relative;
            padding: 20px 40px;
            font-size: 1.5em;
            color: #16e2db;
            background-color: #02072e00;
            border: 2px solid #16e2db;
            border-radius: 10px;
            
            cursor: pointer;
            overflow: hidden;
        }

        button:hover{
            display: block;
            border: none;            
            color: #02072e;
            background-color: #16e2db;
            filter: drop-shadow(0 0 5px #fffdef);
        }
    </style>
</head>
<body>
    <button class="">Hover Me</button>
</body>
</html>
