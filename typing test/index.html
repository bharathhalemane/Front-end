<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container" id="speedTypingTest">
        <h1 class="heading">Speed Typing Test</h1>
        <p class="pargraph">On your fingers lets set Go!</p>
        <div class="d-flex flex-row justify-content-center mt-3 mb-3">
            <div class="spinner-border d-none" id="spinner" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>
        <div class="d-flex flex-row justify-content-start">
            <img height="50px" class="mr-5" src="https://assets.ccbp.in/frontend/dynamic-webapps/clock-img.png" alt="" />
            <p id="timer" class="seconds">0</p>
            <p class="par">seconds</p>
        </div>
        <div class="form-container">
            <p id="quoteDisplay"></p>
            <textarea name="quoteInput" id="quoteInput" rows="6" cols="30" placeholder="Type here!"></textarea>
        </div>

        <p id="result" class="result-Msg"></p>
        <div>
            <button class="btn button-1 mr-4" id="submitBtn">Submit</button>
            <button class="btn btn-light" id="resetBtn">Reset</button>
        </div>
    </div>


</body>

<script type="text/javascript" src="script.js"></script>
</html>
