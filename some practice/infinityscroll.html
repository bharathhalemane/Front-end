<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll</title>
    <style>
        *,
        *::before,
        *::after{
            box-sizing: border-box;
        }

        *{
            margin: 0;
        }

        .wrapper{            
            width: 90%;
            max-width: 1536px;
            border: 1px solid black;
            margin: 20px;
            position: relative;
            
            margin-top: 5rem;
            height: 170px;
            overflow: hidden;
            mask-image: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(0, 0, 0, 1) 20%, rgba(0, 0, 0, 1) 80%, rgba(0, 0, 0, 0));
        }

        @keyframes scrollLeft{
            
            to {
                left: -300px;
            }
        }

        .item{
            width: 300px;
            height: 150px;
            /*background-color: red;*/
            
            border-radius: 6px;
            position: absolute;            
            left: calc(300px * 8);
            animation-name: scrollLeft;
            animation-duration: 30s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            
        }

        .item1{
            animation-delay: calc(30s / 8 * ( 8 - 1 ) * -1);
        }
        .item2{
            animation-delay: calc(30s / 8 * ( 8 - 2 ) * -1);
        }
        .item3{
            animation-delay: calc(30s / 8 * ( 8 - 3 ) * -1);
        }
        .item4{
            animation-delay: calc(30s / 8 * ( 8 - 4 ) * -1);
        }
        .item5{
            animation-delay: calc(30s / 8 * ( 8 - 5 ) * -1);
        }
        .item6{
            animation-delay: calc(30s / 8 * ( 8 - 6 ) * -1);
        }
        .item7{
            animation-delay: calc(30s / 8 * ( 8 - 7 ) * -1);
        }
        .item8{
            animation-delay: calc(30s / 8 * ( 8 - 8 ) * -1);
        }
        
        .image{
            background-size: cover;
            width: 300px;
            height:150px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="item item1">
            <img class="image" src="assets/img1.jpg"  alt="">
        </div>
        <div class="item item2">
            <img class="image" src="assets/img2.jpg"  alt="">
        </div>
        <div class="item item3">
            <img class="image" src="assets/img3.png"  alt="">
        </div>
        <div class="item item4">
            <img class="image" src="assets/img4.png"  alt="">
        </div>
        <div class="item item5">
            <img class="image" src="assets/img5.jpg"  alt="">
        </div>
        <div class="item item6">
            <img class="image" src="assets/img6.jpg"  alt="">
        </div>
        <div class="item item7">
            <img class="image" src="assets/img7.jpg"  alt="">
        </div>
        <div class="item item8">
            <img class="image" src="assets/img8.jpg"  alt="">
        </div>

    </div>
</body>
</html>
