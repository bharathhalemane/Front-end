<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>toggle</title>
</head>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 20%;
        background-color: white;
    }
    label {
        font-size: 20px;
        margin-right: 20px;
    }   
    input{
        border-width: 2px;
        border-radius: 10px;
        width: 50px;
        height: 50px;
    }
</style>
<body>
    <label for="toggle">Switch</label>
    
    <input type="checkbox" id="toggle" onclick="document.body.style.backgroundColor = this.checked ? 'black' : 'white';
    document.body.style.color = this.checked ? 'white' : 'black';">
</body>
</html>
